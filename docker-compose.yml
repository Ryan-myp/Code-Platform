version: '3.8'

services:
  # 基础镜像服务（可选）
  base:
    build:
      context: .
      dockerfile: Dockerfile.base
    image: code-platform-base:latest
    tags:
      - code-platform-base:latest
    # 仅用于构建基础镜像，不运行
    command: ["sleep", "infinity"]
    profiles:
      - base

  # 主应用服务
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: code-platform:latest
    ports:
      - "8888:8888"
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite:////data/platform.db
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - AGNES_API_KEY=${AGNES_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - PYTHONUNBUFFERED=1
    volumes:
      - db_data:/data
      - ./backend/.optimizer_reports:/app/backend/.optimizer_reports
      - ./backend/backups:/app/backend/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - base
    profiles:
      - app

volumes:
  db_data:

# 使用方式：
#   docker compose --profile base up -d  # 构建基础镜像
#   docker compose --profile app up -d   # 运行应用
#   docker compose --profile base --profile app up -d  # 全部
