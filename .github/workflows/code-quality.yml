name: Code Quality Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pylint black isort mypy
          
      - name: Check code quality
        run: |
          # 检查代码复杂度
          echo "运行代码质量检查..."
          
          # Flake8 检查
          flake8 backend/ --max-line-length=120 --ignore=E203,W503 || true
          
          # 检查Python语法
          python -m py_compile backend/*.py || exit 1
          
      - name: Run tests
        run: |
          python -m pytest tests/ -v || true
          
      - name: Check complexity
        run: |
          echo "检查代码复杂度..."
          python << 'PYEOF'
          import ast
          from pathlib import Path
          
          project_dir = Path('backend')
          high_complexity_count = 0
          
          for py_file in project_dir.rglob('*.py'):
              if '.venv' in str(py_file) or '__pycache__' in str(py_file):
                  continue
              try:
                  content = py_file.read_text(encoding='utf-8')
                  tree = ast.parse(content)
                  for node in ast.walk(tree):
                      if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                          complexity = 1
                          for child in ast.walk(node):
                              if isinstance(child, (ast.If, ast.While, ast.For, ast.BoolOp, ast.ExceptHandler, ast.With, ast.IfExp)):
                                  complexity += 1
                          if complexity >= 20:
                              high_complexity_count += 1
                              print(f"警告: {py_file.name}::{node.name} 复杂度={complexity}")
              except:
                  pass
          
          print(f"\n高复杂度函数总数: {high_complexity_count}")
          if high_complexity_count > 50:
              print("错误: 高复杂度函数过多，请优化代码")
              exit(1)
          PYEOF
