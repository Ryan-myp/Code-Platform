name: Code Quality Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 pylint black isort mypy pyflakes

      - name: Static syntax check (全后端编译)
        run: |
          # 逐文件编译，任一语法错即 fail（拦住 SyntaxError 合入）
          python - <<'PY'
          import subprocess, sys, pathlib
          bad = []
          for f in sorted(pathlib.Path('backend').rglob('*.py')):
              p = subprocess.run([sys.executable, '-m', 'py_compile', str(f)], capture_output=True, text=True)
              if p.returncode != 0:
                  bad.append(f'{f}: {p.stderr.strip().splitlines()[-1] if p.stderr else "error"}')
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          print('✅ 全后端语法编译通过')
          PY

      - name: Quality gates (契约/未定义变量/密钥)
        run: |
          # 三道真门禁：任一未过即 fail，拦住“能 import、点击才崩”的隐性 bug
          pip install pyflakes
          python backend/quality_gates.py all
          
      - name: Run tests
        run: |
          python -m pytest tests/ -v || true
          
      - name: Check complexity
        run: |
          echo "检查代码复杂度..."
          python << 'PYEOF'
          import ast
          from pathlib import Path
          
          project_dir = Path('backend')
          high_complexity_count = 0
          
          for py_file in project_dir.rglob('*.py'):
              if '.venv' in str(py_file) or '__pycache__' in str(py_file):
                  continue
              try:
                  content = py_file.read_text(encoding='utf-8')
                  tree = ast.parse(content)
                  for node in ast.walk(tree):
                      if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                          complexity = 1
                          for child in ast.walk(node):
                              if isinstance(child, (ast.If, ast.While, ast.For, ast.BoolOp, ast.ExceptHandler, ast.With, ast.IfExp)):
                                  complexity += 1
                          if complexity >= 20:
                              high_complexity_count += 1
                              print(f"警告: {py_file.name}::{node.name} 复杂度={complexity}")
              except:
                  pass
          
          print(f"\n高复杂度函数总数: {high_complexity_count}")
          if high_complexity_count > 50:
              print("错误: 高复杂度函数过多，请优化代码")
              exit(1)
          PYEOF
